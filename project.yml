name: Grounded

options:
  bundleIdPrefix: com.grounded
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # No development team is set here on purpose. For a free Apple ID you pick
    # your personal team in Xcode -> Signing & Capabilities (see README).
    DEVELOPMENT_TEAM: ""

targets:
  Grounded:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Grounded
        excludes:
          # Template only. The real, git-ignored Secrets.swift is what compiles.
          - "Support/Secrets.example.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grounded.app
        INFOPLIST_FILE: Grounded/Support/Info.plist
        # 1 = iPhone only.
        TARGETED_DEVICE_FAMILY: "1"
        # SwiftUI App lifecycle, no storyboard.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
