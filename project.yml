name: Grounded

options:
  bundleIdPrefix: com.grounded
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

# DEFAULT BUILD: runs on a real iPhone with a free Apple ID. It requests no
# Family Controls, no App Groups, and embeds no Screen Time extensions, so app
# blocking is paused. The Screen Time build (needs a paid developer account) is
# project.screentime.yml:  xcodegen generate --spec project.screentime.yml
#
# Personal settings (your team ID, bundle ID, server host) live in
# Config/Local.xcconfig, which is gitignored. See Config/Local.xcconfig.example.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  Grounded:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Grounded
        excludes:
          # Template only. The real, git-ignored Secrets.swift is what compiles.
          - "Support/Secrets.example.swift"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GROUNDED_BUNDLE_ID)
        INFOPLIST_FILE: Grounded/Support/Info.plist
        # 1 = iPhone only.
        TARGETED_DEVICE_FAMILY: "1"
        # SwiftUI App lifecycle, no storyboard.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
    scheme:
      testTargets:
        - GroundedTests

  # Logic-only tests for the pure schedule / lockout math (no Screen Time
  # frameworks), so they run on the simulator.
  GroundedTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
      - path: Grounded/Services/NightlyLockout.swift
      - path: Shared/ShieldSchedule.swift
      - path: Shared/BlockLists.swift
      - path: Shared/ShieldShared.swift
      - path: Grounded/Services/Friends
      - path: Grounded/Services/BreakWarningPlan.swift
      - path: Grounded/Services/TrickleSchedule.swift
      - path: Grounded/Services/PhoneHabitStats.swift
      - path: Grounded/Services/OnboardingFlow.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grounded.app.tests
        GENERATE_INFOPLIST_FILE: YES
