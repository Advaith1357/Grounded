name: Grounded

options:
  bundleIdPrefix: com.grounded
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Personal settings (your Apple Developer team ID) live in
# Config/Local.xcconfig, which is gitignored. See Config/Local.xcconfig.example.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targetTemplates:
  # All three Screen Time extensions need the same entitlements: Family
  # Controls itself, plus the App Group they use to share the app's saved
  # app selection.
  ScreenTimeExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    entitlements:
      path: Config/Extension.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.grounded.app]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"

targets:
  Grounded:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Grounded
        excludes:
          # Template only. The real, git-ignored Secrets.swift is what compiles.
          - "Support/Secrets.example.swift"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grounded.app
        INFOPLIST_FILE: Grounded/Support/Info.plist
        # 1 = iPhone only.
        TARGETED_DEVICE_FAMILY: "1"
        # SwiftUI App lifecycle, no storyboard.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
    entitlements:
      path: Config/Grounded.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.grounded.app]
    dependencies:
      - target: ShieldConfiguration
      - target: ShieldAction
      - target: DeviceActivityMonitor
    scheme:
      testTargets:
        - GroundedTests

  # Custom interceptor screen shown when a shielded app is opened.
  ShieldConfiguration:
    templates: [ScreenTimeExtension]
    sources:
      - path: ShieldConfiguration
    info:
      path: ShieldConfiguration/Info.plist
      properties:
        CFBundleDisplayName: ShieldConfiguration
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grounded.app.ShieldConfiguration

  # Handles taps on the interceptor screen's button.
  ShieldAction:
    templates: [ScreenTimeExtension]
    sources:
      - path: ShieldAction
    info:
      path: ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: ShieldAction
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grounded.app.ShieldAction

  # Re-grounds when a break ends or the nightly Circuit Breaker opens, even if
  # the app isn't running.
  DeviceActivityMonitor:
    templates: [ScreenTimeExtension]
    sources:
      - path: DeviceActivityMonitor
      - path: Shared
    info:
      path: DeviceActivityMonitor/Info.plist
      properties:
        CFBundleDisplayName: DeviceActivityMonitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grounded.app.DeviceActivityMonitor

  # Logic-only tests for the pure schedule / lockout math (no Screen Time
  # frameworks), so they run on the simulator.
  GroundedTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
      - path: Grounded/Services/NightlyLockout.swift
      - path: Shared/ShieldSchedule.swift
      - path: Grounded/Services/Friends
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grounded.app.tests
        GENERATE_INFOPLIST_FILE: YES
